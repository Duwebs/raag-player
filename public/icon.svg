<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#050505"/>
  <defs>
    <linearGradient id="body" x1="256" y1="160" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="55%" stopColor="#0369A1" />
      <stop offset="100%" stopColor="#0D9488" />
    </linearGradient>
    <radialGradient id="crest" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="85%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#F59E0B" />
    </radialGradient>
    <linearGradient id="headband" x1="100" y1="150" x2="412" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="50%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#E11D48" />
    </linearGradient>
    <linearGradient id="beak" x1="256" y1="290" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <!-- Three Peacock Feather Crests (Kalgi) -->
  <path d="M 220 180 Q 185 110 160 80" stroke="#059669" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="155" cy="70" rx="22" ry="30" transform="rotate(-25 155 70)" fill="url(#crest)"/>
  <circle cx="155" cy="70" r="9" fill="#042F2E"/>

  <path d="M 256 170 L 256 50" stroke="#059669" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="256" cy="45" rx="24" ry="32" fill="url(#crest)"/>
  <circle cx="256" cy="45" r="10" fill="#042F2E"/>

  <path d="M 292 180 Q 327 110 352 80" stroke="#059669" stroke-width="10" stroke-linecap="round" fill="none"/>
  <ellipse cx="357" cy="70" rx="22" ry="30" transform="rotate(25 357 70)" fill="url(#crest)"/>
  <circle cx="357" cy="70" r="9" fill="#042F2E"/>

  <!-- Headphones Band -->
  <path d="M 110 290 C 110 150 402 150 402 290" stroke="url(#headband)" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- Peacock Face -->
  <circle cx="256" cy="290" r="145" fill="url(#body)"/>
  <ellipse cx="256" cy="340" rx="100" ry="80" fill="#14B8A6" opacity="0.35"/>

  <!-- White Eye Patches -->
  <ellipse cx="205" cy="265" rx="38" ry="34" fill="#F8FAFC"/>
  <ellipse cx="307" cy="265" rx="38" ry="34" fill="#F8FAFC"/>

  <!-- Pupils -->
  <circle cx="208" cy="270" r="21" fill="#09090B"/>
  <circle cx="214" cy="264" r="8" fill="#FFFFFF"/>
  <circle cx="304" cy="270" r="21" fill="#09090B"/>
  <circle cx="310" cy="264" r="8" fill="#FFFFFF"/>

  <!-- Beak -->
  <polygon points="256,290 225,340 287,340" fill="url(#beak)"/>
  <polygon points="256,290 238,328 274,328" fill="#FBBF24"/>
  <path d="M 225 340 Q 256 358 287 340 Z" fill="#B45309"/>

  <!-- Earcups -->
  <rect x="76" y="240" width="52" height="110" rx="26" fill="#F43F5E"/>
  <rect x="94" y="258" width="22" height="74" rx="11" fill="#FDA4AF" opacity="0.6"/>
  <rect x="384" y="240" width="52" height="110" rx="26" fill="#F43F5E"/>
  <rect x="396" y="258" width="22" height="74" rx="11" fill="#FDA4AF" opacity="0.6"/>
</svg>
