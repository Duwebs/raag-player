[build]
  command = "pnpm run build"
  publish = "dist"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/bundle.zip"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/zip"

[[redirects]]
  from = "/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/bundle.zip"
  to = "/bundle.zip"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
