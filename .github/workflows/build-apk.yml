name: Build Raag Player Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm approve-builds --all || true

      - name: Build Web Application & Pack OTA Bundle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OTA_VERSION: 1.0.${{ github.run_number }}
          OTA_NOTES: Live OTA Update #${{ github.run_number }}
          OTA_BUNDLE_URL: https://cdn.jsdelivr.net/gh/Duwebs/raag-player@main/ota/bundle.zip
        run: pnpm run build

      - name: Commit & Push OTA Live Assets to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ota/version.json ota/bundle.zip
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(ota): publish 1.0.${{ github.run_number }} [skip ci]"
          git push origin HEAD:main || true

      - name: Sync Capacitor Android Project
        run: pnpm exec cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Raag Player APK
        uses: actions/upload-artifact@v4
        with:
          name: Raag-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
